version: "2"
sql:
  - engine: postgresql
    schema: migrations # sqlc reads the goose "Up" sections
    queries: internal/store/queries
    gen:
      go:
        package: db
        out: internal/store/db
        sql_package: pgx/v5
        emit_json_tags: false
        overrides:
          - db_type: vector
            nullable: true
            go_type:
              import: github.com/pgvector/pgvector-go
              package: pgvector
              type: Vector
