version: "2"
run:
  timeout: 5m
linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - copyloopvar
    - errname
    - errorlint
    - gosec
    - misspell
    - nilerr
    - noctx
    - sloglint
    - thelper
    - tparallel
    - unconvert
    - usestdlibvars
  settings:
    sloglint:
      no-mixed-args: true
      kv-only: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec]
formatters:
  enable:
    - gofmt
    - goimports
